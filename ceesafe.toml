[package]
name = "httpclient"
version = "0.1.0"
kind = "library"
sources = ["src"]
tests = ["tests"]
ceesafec = ">=0.69.0"        # ADR 0160: a method's result borrows from its receiver (client.get, response.header)

[dependencies]
web_core = { git = "https://github.com/CeeSafe/CeeSafe.Web.git", rev = "c4b27880cec4350894393344651497d54cffce1d", dir = "packages/web_core" }
web_transport = { git = "https://github.com/CeeSafe/CeeSafe.Web.git", rev = "c4b27880cec4350894393344651497d54cffce1d", dir = "packages/web_transport" }
# TLS: OpenSSL 3 through web_tls's C shim, the only C below this package.
web_tls = { git = "https://github.com/CeeSafe/CeeSafe.Web.git", rev = "c4b27880cec4350894393344651497d54cffce1d", dir = "packages/web_tls" }
# Base64, for the WebSocket handshake's key.
encoding = { git = "https://github.com/CeeSafe/CeeSafeLibs.git", rev = "ca0a13fec248bbe192f0b61b930c8b8259175eed", dir = "encoding" }
